[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bill-extractor"
version = "0.5.0"
description = "Extract structured expense data from receipt photos and PDFs using DocTR OCR + Qwen2.5 LLM"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",   # required by FastAPI for file uploads
    "httpx>=0.27.0",             # async proxy to remote OCR server
    "loguru>=0.7.0",             # structured logging
    "rich>=13.0",                # CLI output formatting

    # OCR — DocTR with PyTorch backend (pypdfium2 enables PDF support)
    # Note: [torch] extra was removed in doctr v1.0; PyTorch is now the only backend
    "python-doctr>=0.9.0",
    "pypdfium2>=4.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0",

    # LLM inference
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",    # required by transformers for device placement
]

[project.optional-dependencies]
# Developer tooling
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "httpx>=0.27.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
llamacpp = [
    "llama-cpp-python>=0.2.80",
]
# YAML config support (optional — JSON config works without this)
yaml = [
    "pyyaml>=6.0",
]

[project.scripts]
bill-extractor = "bill_extractor.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bill_extractor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools.package-data]
bill_extractor = ["templates/*.html"]
