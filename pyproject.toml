[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bill-extractor"
version = "0.4.0"
description = "Extract structured expense data from receipt photos and PDFs using DocTR OCR + Qwen2.5 LLM"
requires-python = ">=3.10"

dependencies = [
    # Web framework
    "flask>=3.0",

    # OCR — DocTR with PyTorch backend (pypdfium2 enables PDF support)
    "python-doctr[torch]>=0.9.0",
    "pypdfium2>=4.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0",

    # LLM inference
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",    # required by transformers for device placement
]

[project.optional-dependencies]
# Developer tooling
dev = [
    "pytest>=8.0",
]

[project.scripts]
bill-extractor          = "bill_extractor.app:main"
bill-extractor-download = "bill_extractor.download_models:download"
bill-extractor-cli      = "bill_extractor.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bill_extractor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools.package-data]
bill_extractor = ["templates/*.html"]
