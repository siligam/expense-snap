<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Extractor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --navy:   #1e293b;
      --navy2:  #0f172a;
      --blue:   #2563eb;
      --blue-l: #eff6ff;
      --green:  #16a34a;
      --red:    #dc2626;
      --amber:  #d97706;
      --purple: #7c3aed;
      --bg:     #f1f5f9;
      --card:   #ffffff;
      --border: #e2e8f0;
      --muted:  #64748b;
      --mono:   'IBM Plex Mono', monospace;
      --sans:   'IBM Plex Sans', sans-serif;
    }

    body {
      background: var(--bg);
      font-family: var(--sans);
      font-size: 14px;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    .topbar {
      background: var(--navy);
      padding: 0 1.5rem;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.3px;
    }
    .topbar-brand .icon-wrap {
      width: 28px; height: 28px;
      background: var(--blue);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
    }
    .topbar-brand span { color: #93c5fd; }

    .btn-reset {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.75);
      font-size: 0.78rem;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.15s;
    }
    .btn-reset:hover { background: rgba(220,38,38,0.15); border-color: rgba(220,38,38,0.5); color: #fca5a5; }

    /* ── Tabs ── */
    .tab-bar {
      background: var(--navy2);
      padding: 0 1.5rem;
      display: flex;
      gap: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .tab-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.45);
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 10px 18px;
      cursor: pointer;
      position: relative;
      transition: color 0.15s;
      letter-spacing: 0.3px;
    }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0; left: 18px; right: 18px;
      height: 2px;
      background: var(--blue);
      transform: scaleX(0);
      transition: transform 0.2s;
      border-radius: 2px 2px 0 0;
    }
    .tab-btn.active { color: #fff; }
    .tab-btn.active::after { transform: scaleX(1); }
    .tab-btn .tab-count {
      background: rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 0.68rem;
      margin-left: 5px;
    }
    .tab-btn.active .tab-count { background: var(--blue); }

    /* ── Tab content ── */
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ── Drop zone ── */
    .page-pad { padding: 1.5rem; }

    #dropZone {
      border: 1.5px dashed #94a3b8;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      background: var(--card);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    #dropZone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #eff6ff 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    #dropZone:hover { border-color: var(--blue); }
    #dropZone:hover::before { opacity: 1; }
    .drop-icon { font-size: 2rem; color: #94a3b8; display: block; margin-bottom: 0.5rem; }
    .drop-text { color: var(--muted); font-size: 0.88rem; margin: 0; }
    .drop-text strong { color: var(--navy); }

    /* ── Full-page drag overlay ── */
    #dragOverlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.85);
      backdrop-filter: blur(4px);
      z-index: 9000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      pointer-events: none;
    }
    #dragOverlay.show { display: flex; }
    #dragOverlay .ol-icon {
      width: 80px; height: 80px;
      border: 2px dashed rgba(255,255,255,0.5);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: rgba(255,255,255,0.7);
      animation: pulseRing 1.2s ease-in-out infinite;
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }
    #dragOverlay p { color: rgba(255,255,255,0.85); font-size: 1.1rem; font-weight: 500; margin: 0; }

    /* ── Results ── */
    .results-wrap { margin-top: 1.25rem; }

    .col-header {
      display: grid;
      grid-template-columns: 150px minmax(150px,0.8fr) 1fr 200px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      overflow: hidden;
    }
    .col-header > div {
      padding: 8px 12px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      border-right: 1px solid var(--border);
    }
    .col-header > div:last-child { border-right: none; }

    .result-rows { border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }

    .result-row {
      display: grid;
      grid-template-columns: 150px minmax(150px,0.8fr) 1fr 200px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      transition: background 0.1s;
    }
    .result-row:last-child { border-bottom: none; }
    .result-row:hover { background: #fafcff; }

    .result-row > .rc {
      padding: 12px;
      border-right: 1px solid var(--border);
    }
    .result-row > .rc:last-child { border-right: none; }

    /* Spinner row */
    .row-spinner {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
    .row-spinner:last-child { border-bottom: none; }

    /* Error row */
    .row-error {
      padding: 12px;
      background: #fff5f5;
      border-bottom: 1px solid var(--border);
      color: var(--red);
      font-size: 0.82rem;
      display: flex; align-items: center; gap: 8px;
    }

    /* ── Image col ── */
    .thumb-img {
      width: 126px; height: 100px;
      object-fit: cover;
      border-radius: 6px;
      cursor: zoom-in;
      border: 1px solid var(--border);
      display: block;
      transition: opacity 0.15s;
    }
    .thumb-img:hover { opacity: 0.88; }
    .thumb-name { font-size: 0.68rem; color: var(--muted); margin-top: 5px; word-break: break-all; max-width: 126px; line-height: 1.3; }
    .src-badge {
      font-size: 0.63rem; font-weight: 700; padding: 2px 7px;
      border-radius: 20px; display: inline-block; margin-top: 4px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .src-new      { background: #dcfce7; color: #166534; }
    .src-cache    { background: #dbeafe; color: #1e40af; }
    .src-history  { background: #ede9fe; color: #5b21b6; }

    /* ── Fields col ── */
    .cat-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.72rem; font-weight: 700;
      padding: 3px 10px; border-radius: 20px; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .cat-food   { background: #fef9c3; color: #854d0e; }
    .cat-travel { background: #e0f2fe; color: #0c4a6e; }
    .cat-hotel  { background: #fce7f3; color: #831843; }
    .cat-other  { background: #f1f5f9; color: #475569; }

    .kv-table { width: 100%; border-collapse: collapse; }
    .kv-table tr td { padding: 2px 0; vertical-align: top; }
    .kv-table .kv-key {
      font-size: 0.72rem; color: var(--muted); font-weight: 500;
      width: 44%; padding-right: 8px; white-space: nowrap;
    }
    .kv-table .kv-val {
      font-size: 0.8rem; font-weight: 600; color: var(--navy);
    }

    /* ── Plain text col (editable) ── */
    .plain-ta {
      width: 100%; min-height: 140px;
      font-family: var(--mono); font-size: 0.72rem;
      line-height: 1.7; color: #334155;
      background: #f8fafc; border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px;
      resize: vertical; transition: border-color 0.15s, background 0.15s;
    }
    .plain-ta:focus { outline: none; border-color: var(--blue); background: #fff; }
    .plain-ta.edited { background: #fffbeb; border-color: var(--amber); }
    .plain-actions { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
    .btn-save-plain {
      background: var(--blue); color: #fff; border: none;
      border-radius: 5px; font-size: 0.68rem; font-weight: 600;
      padding: 3px 10px; cursor: pointer; font-family: var(--sans);
      display: inline-flex; align-items: center; gap: 4px;
      transition: background 0.15s;
    }
    .btn-save-plain:hover { background: #1d4ed8; }
    .btn-save-plain.saved { background: var(--green); }
    .btn-undo-plain {
      background: none; border: 1px solid var(--border);
      border-radius: 5px; font-size: 0.68rem; color: var(--muted);
      padding: 3px 10px; cursor: pointer; font-family: var(--sans);
      display: inline-flex; align-items: center; gap: 4px;
      transition: all 0.15s;
    }
    .btn-undo-plain:hover { border-color: var(--amber); color: var(--amber); }
    .btn-copy {
      background: none; border: 1px solid var(--border);
      border-radius: 5px; font-size: 0.68rem; color: var(--muted);
      padding: 3px 9px; cursor: pointer; font-family: var(--sans);
      transition: all 0.15s; display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-copy:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn-copy.copied { background: var(--green); color: #fff; border-color: var(--green); }

    /* ── Actions col ── */
    .action-col { display: flex; flex-direction: column; gap: 6px; }
    .action-ts { font-size: 0.63rem; color: #94a3b8; font-family: var(--mono); }
    .edited-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.65rem; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
      background: #fef3c7; color: #92400e;
      text-transform: uppercase; letter-spacing: 0.3px;
    }

    /* ── Empty state ── */
    #emptyState {
      text-align: center; padding: 4rem 1rem;
      color: #94a3b8;
    }
    #emptyState .empty-icon {
      font-size: 3rem; margin-bottom: 1rem; opacity: 0.35;
    }
    #emptyState p { font-size: 0.9rem; }

    /* ── History tab ── */
    .hist-session {
      margin-bottom: 1.5rem;
    }
    .hist-session-label {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: var(--navy);
      color: rgba(255,255,255,0.85);
      border-radius: 8px 8px 0 0;
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .hist-session-label .hs-meta { color: rgba(255,255,255,0.45); font-size: 0.72rem; font-weight: 400; margin-left: auto; }
    .hist-session-label .hs-chevron { color: rgba(255,255,255,0.4); transition: transform 0.2s; }
    .hist-session-label.collapsed .hs-chevron { transform: rotate(-90deg); }
    .hist-session-body { display: block; }
    .hist-session-body.hidden { display: none; }

    .thumb-date { font-size: 0.63rem; color: #94a3b8; margin-top: 4px; font-family: var(--mono); line-height: 1.4; }

    .btn-delete {
      border: 1px solid #fecaca; border-radius: 6px;
      background: #fff5f5; color: #991b1b;
      font-size: 0.75rem; font-weight: 500;
      padding: 5px 10px; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: all 0.15s; font-family: var(--sans); width: 100%;
    }
    .btn-delete:hover { background: var(--red); color: #fff; border-color: var(--red); }
    .btn-delete:disabled { opacity: 0.5; cursor: not-allowed; }

    .hist-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; padding: 0.5rem 0;
    }
    .hist-total { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
    .btn-clear-hist {
      background: none; border: 1px solid #fecaca;
      color: #991b1b; border-radius: 6px;
      font-size: 0.75rem; padding: 4px 12px; cursor: pointer;
      font-family: var(--sans); transition: all 0.15s;
      display: flex; align-items: center; gap: 5px;
    }
    .btn-clear-hist:hover:not(:disabled) { background: var(--red); color: #fff; border-color: var(--red); }
    .btn-clear-hist:disabled { opacity: 0.4; cursor: not-allowed; }

    .hist-empty { text-align: center; padding: 3rem; color: #94a3b8; font-size: 0.88rem; }

    /* ── Filter panel ── */
    .filter-toggle {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.75rem; font-weight: 500;
      color: var(--muted); padding: 4px 12px; cursor: pointer;
      font-family: var(--sans); display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.15s;
    }
    .filter-toggle:hover { border-color: var(--blue); color: var(--blue); }
    .filter-toggle.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .filter-badge {
      background: #fff3; border-radius: 10px;
      padding: 1px 6px; font-size: 0.65rem; font-weight: 700;
    }
    .filter-panel {
      display: none;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px;
      margin-bottom: 1rem;
      gap: 14px; flex-wrap: wrap; align-items: flex-end;
    }
    .filter-panel.open { display: flex; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group label {
      font-size: 0.68rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .filter-input {
      border: 1px solid var(--border); border-radius: 5px;
      font-size: 0.78rem; padding: 4px 8px; font-family: var(--sans);
      color: var(--navy); background: #f8fafc;
      height: 30px;
    }
    .filter-input:focus { outline: none; border-color: var(--blue); background: #fff; }
    .filter-cat-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .btn-filter-cat {
      border: 1px solid var(--border); border-radius: 20px;
      background: var(--card); color: var(--muted);
      font-size: 0.72rem; font-weight: 600; padding: 3px 11px;
      cursor: pointer; font-family: var(--sans); transition: all 0.15s;
    }
    .btn-filter-cat:hover { border-color: var(--blue); color: var(--blue); }
    .btn-filter-cat.on { background: var(--navy); border-color: var(--navy); color: #fff; }
    .filter-amount-row { display: flex; gap: 5px; align-items: center; }
    .filter-select {
      border: 1px solid var(--border); border-radius: 5px;
      font-size: 0.78rem; padding: 4px 6px; font-family: var(--sans);
      color: var(--navy); background: #f8fafc; height: 30px; cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: var(--blue); }
    .btn-clear-filter {
      background: none; border: 1px solid var(--border); border-radius: 5px;
      color: var(--muted); font-size: 0.72rem; padding: 4px 10px;
      cursor: pointer; font-family: var(--sans); transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 4px; height: 30px;
    }
    .btn-clear-filter:hover { background: #fee2e2; border-color: #fca5a5; color: var(--red); }
    .filter-result-count {
      font-size: 0.72rem; color: var(--muted); font-style: italic; margin-left: auto;
    }

    /* ── Sort bar ── */
    .sort-bar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .sort-label { font-size: 0.75rem; color: var(--muted); font-weight: 600; margin-right: 2px; }
    .btn-sort {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.75rem; font-weight: 500;
      color: var(--muted); padding: 4px 12px; cursor: pointer;
      font-family: var(--sans); display: inline-flex; align-items: center; gap: 5px;
      transition: all 0.15s;
    }
    .btn-sort:hover { border-color: var(--blue); color: var(--blue); }
    .btn-sort.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-sort .sort-arrow { font-size: 0.65rem; opacity: 0.8; }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #lightbox.show { display: flex; }
    #lightbox img {
      max-width: 88vw; max-height: 88vh;
      border-radius: 8px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      cursor: default;
    }
    #lightbox .lb-close {
      position: fixed; top: 1.2rem; right: 1.5rem;
      color: rgba(255,255,255,0.7); font-size: 1.8rem;
      cursor: pointer; z-index: 10000;
      transition: color 0.15s;
    }
    #lightbox .lb-close:hover { color: #fff; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 1.25rem; right: 1.25rem;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      z-index: 10001;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      max-width: 280px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.t-info    { background: var(--navy);  color: #fff; }
    #toast.t-success { background: var(--green); color: #fff; }
    #toast.t-error   { background: var(--red);   color: #fff; }

    /* ── Summary table ── */
    .summary-wrap {
      margin-top: 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .summary-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }
    .summary-title {
      font-size: 0.78rem; font-weight: 700; color: var(--navy);
      text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; align-items: center; gap: 6px;
    }
    .summary-actions { display: flex; align-items: center; gap: 8px; }
    .summary-sel-count { font-size: 0.72rem; color: var(--muted); }
    .btn-export {
      background: var(--blue); color: #fff; border: none;
      border-radius: 6px; font-size: 0.78rem; font-weight: 600;
      padding: 5px 14px; cursor: pointer; font-family: var(--sans);
      display: inline-flex; align-items: center; gap: 6px;
      transition: background 0.15s;
    }
    .btn-export:hover:not(:disabled) { background: #1d4ed8; }
    .btn-export:disabled { opacity: 0.45; cursor: not-allowed; }
    .summary-table {
      width: 100%; border-collapse: collapse;
      font-size: 0.8rem;
    }
    .summary-table thead th {
      padding: 7px 12px; background: #f8fafc;
      text-align: left; font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--muted); border-bottom: 1px solid var(--border);
    }
    .summary-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .summary-table tbody tr:last-child { border-bottom: none; }
    .summary-table tbody tr:hover { background: #fafcff; }
    .summary-table td {
      padding: 7px 12px; vertical-align: middle;
    }
    .summary-table td.sum-filename {
      font-family: var(--mono); font-size: 0.72rem; color: var(--navy);
      word-break: break-all; max-width: 240px;
    }
    .summary-table td.sum-cat {
      font-weight: 600; font-size: 0.75rem;
    }
    .summary-table td.sum-amount {
      font-weight: 700; color: var(--green); text-align: right;
    }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="icon-wrap"><i class="fa-solid fa-receipt"></i></div>
    Bill <span>Extractor</span>
  </div>
  <button class="btn-reset" onclick="resetSession()">
    <i class="fa-solid fa-rotate-left"></i> Reset
  </button>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-current-btn" onclick="switchTab('current')">
    Current Session
    <span class="tab-count" id="tab-current-count">0</span>
  </button>
  <button class="tab-btn" id="tab-history-btn" onclick="switchTab('history')">
    History
    <span class="tab-count" id="tab-history-count">—</span>
  </button>
</div>

<!-- Current session tab -->
<div class="tab-pane active page-pad" id="tab-current">

  <!-- Drop zone -->
  <div id="dropZone" onclick="document.getElementById('fileInput').click()">
    <i class="fa-solid fa-cloud-arrow-up drop-icon"></i>
    <p class="drop-text"><strong>Drag &amp; drop</strong> bill images anywhere — or click to browse</p>
    <p class="drop-text" style="margin-top:4px;font-size:0.78rem;">JPEG, PNG, WEBP · Multiple files supported</p>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFileInput(this)" />
  </div>

  <!-- Results -->
  <div class="results-wrap" id="resultsWrap" style="display:none;">
    <div class="col-header">
      <div><i class="fa-regular fa-image me-1"></i> Image</div>
      <div><i class="fa-solid fa-table-list me-1"></i> Extracted Fields</div>
      <div><i class="fa-solid fa-align-left me-1"></i> Plain Text</div>
      <div><i class="fa-solid fa-check-double me-1"></i> Actions</div>
    </div>
    <div class="result-rows" id="resultsBody"></div>
  </div>

  <!-- Summary table -->
  <div class="summary-wrap" id="summaryWrap" style="display:none;">
    <div class="summary-header">
      <div class="summary-title">
        <i class="fa-solid fa-table-list"></i> Summary
      </div>
      <div class="summary-actions">
        <span class="summary-sel-count" id="summarySelCount"></span>
        <button class="btn-export" id="btnExport" onclick="exportSelected()" disabled>
          <i class="fa-solid fa-file-zipper"></i> Export Selected
        </button>
      </div>
    </div>
    <table class="summary-table">
      <thead>
        <tr>
          <th style="width:36px;text-align:center;">
            <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" title="Select all">
          </th>
          <th>Filename</th>
          <th>Date</th>
          <th>Category</th>
          <th style="text-align:right;">Amount</th>
        </tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
  </div>

  <!-- Empty -->
  <div id="emptyState">
    <div class="empty-icon"><i class="fa-regular fa-file-image"></i></div>
    <p>Drop one or more bill images to extract structured data.</p>
  </div>

</div>

<!-- History tab -->
<div class="tab-pane page-pad" id="tab-history">
  <div id="historyBody"><p class="hist-empty">Loading…</p></div>
</div>

<!-- Full-page drag overlay -->
<div id="dragOverlay">
  <div class="ol-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
  <p>Drop images to process</p>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <span class="lb-close" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></span>
  <img id="lightboxImg" src="" alt="" onclick="event.stopPropagation()" />
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
// Constants
// ─────────────────────────────────────────────────────────────
const CAT_ICONS   = { food:'🍽️', travel:'✈️', hotel:'🏨', other:'📄' };
const CAT_CLASSES = { food:'cat-food', travel:'cat-travel', hotel:'cat-hotel' };
const CURR_SYMS   = { INR:'₹', USD:'$', EUR:'€', GBP:'£' };
const SRC_LABEL   = { new:'New', cache:'Cached', history:'From History' };
const SRC_CLASS   = { new:'src-new', cache:'src-cache', history:'src-history' };

let rowIdx = 0;
let _dragHideTimer = null;

// ─────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const items = await fetch('/api/cache').then(r => r.json()).catch(() => []);
  if (Array.isArray(items) && items.length) {
    items.forEach(item => addRow({ ...item, source: item.source || 'cache' }));
  }
  updateTabCount();
});

// ─────────────────────────────────────────────────────────────
// Tabs
// ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById(`tab-${name}-btn`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'history') loadHistory();
}

function updateTabCount() {
  const n = document.getElementById('resultsBody').children.length;
  document.getElementById('tab-current-count').textContent = n;
}

// ─────────────────────────────────────────────────────────────
// Drag-and-drop (anywhere on page)
// ─────────────────────────────────────────────────────────────
const overlay = document.getElementById('dragOverlay');

// dragover fires continuously while dragging — use it to show the overlay
// and schedule hiding it (drop fires before the timer expires)
document.addEventListener('dragover', e => {
  e.preventDefault();               // required: allows drop to fire
  if (!e.dataTransfer.types.includes('Files')) return;
  overlay.classList.add('show');
  clearTimeout(_dragHideTimer);
  _dragHideTimer = setTimeout(() => overlay.classList.remove('show'), 150);
});

document.addEventListener('drop', e => {
  e.preventDefault();               // stop browser from opening the file
  clearTimeout(_dragHideTimer);
  overlay.classList.remove('show');
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (files.length) handleFiles(files);
});

// dragleave only fires when cursor leaves the browser window entirely
document.addEventListener('dragleave', e => {
  if (e.relatedTarget === null) {   // truly left the window
    clearTimeout(_dragHideTimer);
    overlay.classList.remove('show');
  }
});

function handleFileInput(input) {
  handleFiles([...input.files]);
  input.value = '';
}

async function handleFiles(files) {
  const imgs = files.filter(f => f.type.startsWith('image/'));
  if (!imgs.length) { showToast('No image files found', 'error'); return; }
  for (const f of imgs) await processFile(f);
}

// ─────────────────────────────────────────────────────────────
// Processing
// ─────────────────────────────────────────────────────────────
async function processFile(file) {
  const id = `r${++rowIdx}`;
  addSpinner(id, file.name);

  const fd = new FormData();
  fd.append('image', file);
  try {
    const res  = await fetch('/api/process', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    replaceSpinner(id, data);
    if (data.source !== 'new') showToast(`Found existing result for ${file.name}`, 'info');
  } catch (err) {
    replaceSpinnerError(id, file.name, err.message);
  }
  updateTabCount();
}

// ─────────────────────────────────────────────────────────────
// DOM helpers
// ─────────────────────────────────────────────────────────────
function showResultsArea() {
  document.getElementById('resultsWrap').style.display = '';
  document.getElementById('emptyState').style.display  = 'none';
}

function addSpinner(id, name) {
  showResultsArea();
  const el = document.createElement('div');
  el.id = id; el.className = 'row-spinner';
  el.innerHTML = `<div class="spinner-border spinner-border-sm text-primary" role="status"></div>
    <span>Processing <strong>${esc(name)}</strong>…</span>`;
  document.getElementById('resultsBody').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function replaceSpinner(id, data) {
  const el = document.getElementById(id);
  if (!el) return;
  el.outerHTML = buildRow(id, data);
  addSummaryRow(id, data);
}

function replaceSpinnerError(id, name, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.outerHTML = `<div id="${id}" class="row-error">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span><strong>${esc(name)}</strong> — ${esc(msg)}</span>
  </div>`;
}

function addRow(data) {
  showResultsArea();
  const id = `r${++rowIdx}`;
  document.getElementById('resultsBody').insertAdjacentHTML('beforeend', buildRow(id, data));
  addSummaryRow(id, data);
  updateTabCount();
}

// ─────────────────────────────────────────────────────────────
// Row builder
// ─────────────────────────────────────────────────────────────
function buildRow(id, data, opts = {}) {
  const src    = data.source || 'new';
  const result = data.result || {};
  const hash   = data.hash   || '';
  const plain  = data.correction || toPlainText(result);

  // Col 1 — image
  const genName  = data.filename_generated || '';
  const origName = data.filename || '';
  const c1 = `
    <div class="rc">
      <img src="${esc(data.image_url)}" class="thumb-img"
           alt="${esc(origName)}"
           onclick="openLightbox('${esc(data.image_url)}')" />
      <div class="thumb-name">${esc(genName || origName)}</div>
      ${genName && genName !== origName
        ? `<div class="thumb-name" style="color:#94a3b8;font-size:0.62rem;font-style:italic;">${esc(origName)}</div>`
        : ''}
      <span class="src-badge ${SRC_CLASS[src] || 'src-new'}">${SRC_LABEL[src] || src}</span>
      <div class="thumb-date"><i class="fa-regular fa-clock"></i> ${fmtDate(data.timestamp)}</div>
    </div>`;

  // Col 2 — rendered fields
  const c2 = `<div class="rc">${renderFields(result)}</div>`;

  // Col 3 — editable plain text
  const c3 = `
    <div class="rc">
      <textarea class="plain-ta" id="${id}-plain"
                data-orig="${esc(plain)}"
                oninput="onPlainInput('${id}')">${esc(plain)}</textarea>
      <div class="plain-actions">
        <button class="btn-save-plain" id="${id}-save" onclick="savePlainEdit('${id}','${esc(hash)}')">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
        <button class="btn-undo-plain" onclick="undoPlainEdit('${id}')">
          <i class="fa-solid fa-rotate-left"></i> Undo
        </button>
        <button class="btn-copy" id="${id}-copy" onclick="copyPlain('${id}')">
          <i class="fa-regular fa-copy"></i> Copy
        </button>
      </div>
    </div>`;

  // Col 4 — actions
  const editedBadge = data.correction
    ? '<span class="edited-badge">✍ Edited</span>' : '';

  const c4 = opts.historyMode ? `
    <div class="rc">
      <div class="action-col">
        ${editedBadge}
        <div class="action-ts">${fmtDate(data.timestamp)}</div>
        <button class="btn-delete" onclick="deleteHistoryItem('${esc(hash)}', this)">
          <i class="fa-solid fa-trash"></i> Delete
        </button>
      </div>
    </div>` : `
    <div class="rc">
      <div class="action-col">
        ${editedBadge}
        <div class="action-ts" id="${id}-edited-wrap">${editedBadge ? '' : ''}</div>
        <div class="action-ts">${fmtDate(data.timestamp)}</div>
        <button class="btn-delete" onclick="deleteSessionItem('${esc(hash)}', this)">
          <i class="fa-solid fa-trash"></i> Delete
        </button>
      </div>
    </div>`;

  return `<div id="${id}" class="result-row">${c1}${c2}${c3}${c4}</div>`;
}

// ─────────────────────────────────────────────────────────────
// Field renderers
// ─────────────────────────────────────────────────────────────
function renderFields(result) {
  if (!result || !Object.keys(result).length)
    return '<span style="color:var(--muted);font-size:0.8rem;">No data</span>';

  const cat  = (result.category || 'other').toLowerCase();
  const icon = CAT_ICONS[cat] || CAT_ICONS.other;
  const cls  = CAT_CLASSES[cat] || 'cat-other';
  const curr = result.currency ? (CURR_SYMS[result.currency] || result.currency) : null;

  let html = `<span class="cat-pill ${cls}">${icon} ${cap(cat)}</span>
    <table class="kv-table">`;

  for (const [k, v] of Object.entries(result)) {
    if (k === 'category') continue;
    const label = k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    let   val   = String(v ?? '');
    // Only add currency symbol if currency field is present in this result
    if (curr && (k === 'amount' || k === 'total_amount')) val = `${curr}${val}`;
    html += `<tr><td class="kv-key">${esc(label)}</td><td class="kv-val">${esc(val)}</td></tr>`;
  }
  html += '</table>';
  return html;
}

function toPlainText(result) {
  if (!result || !Object.keys(result).length) return '(no data)';
  return Object.entries(result)
    .map(([k, v]) => `${k.replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase())}: ${v ?? ''}`)
    .join('\n');
}

// ─────────────────────────────────────────────────────────────
// Plain text editing
// ─────────────────────────────────────────────────────────────
function onPlainInput(id) {
  const ta   = document.getElementById(`${id}-plain`);
  const save = document.getElementById(`${id}-save`);
  if (!ta || !save) return;
  const changed = ta.value !== ta.dataset.orig;
  ta.classList.toggle('edited', changed);
}

async function savePlainEdit(id, hash) {
  const ta   = document.getElementById(`${id}-plain`);
  const save = document.getElementById(`${id}-save`);
  if (!ta) return;
  const text = ta.value;
  ta.dataset.orig = text;           // update baseline so Undo goes to saved value
  ta.classList.remove('edited');
  if (save) {
    save.classList.add('saved');
    save.innerHTML = '<i class="fa-solid fa-check"></i> Saved';
    setTimeout(() => {
      save.classList.remove('saved');
      save.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save';
    }, 2000);
  }
  updateSummaryRow(id, text);
  if (hash) {
    await fetch(`/api/item/${hash}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ correction: text })
    }).catch(() => {});
  }
}

function undoPlainEdit(id) {
  const ta = document.getElementById(`${id}-plain`);
  if (!ta) return;
  ta.value = ta.dataset.orig;
  ta.classList.remove('edited');
}

function copyPlain(id) {
  const text = document.getElementById(`${id}-plain`)?.value || '';
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(`${id}-copy`);
    btn.classList.add('copied');
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
    }, 2000);
  });
}

// ─────────────────────────────────────────────────────────────
// Lightbox
// ─────────────────────────────────────────────────────────────
function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ─────────────────────────────────────────────────────────────
// History
// ─────────────────────────────────────────────────────────────
let _histItems      = [];   // master copy
let _histSortBy     = 'date';
let _histSortDir    = 'desc';
let _histFilterOpen = false;
let _histFilter     = { dateFrom: '', dateTo: '', category: '', amountOp: '', amountVal: '' };

async function loadHistory() {
  document.getElementById('historyBody').innerHTML = '<p class="hist-empty">Loading…</p>';
  try {
    _histItems = await fetch('/api/history').then(r => r.json());
    renderHistoryTab(_histItems);
    document.getElementById('tab-history-count').textContent = _histItems.length;
  } catch {
    document.getElementById('historyBody').innerHTML =
      '<p class="hist-empty" style="color:var(--red)">Failed to load history.</p>';
  }
}

// Parse the extracted date field into a timestamp for sorting.
// Falls back to the entry's added timestamp when year is absent.
function _parseSortDate(item) {
  const raw = (item.result || {}).date || '';
  const fallback = new Date(item.timestamp || 0).getTime();

  // DD/MM/YYYY or DD/MM/YY
  let m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = '20' + y;
    const dt = new Date(`${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`);
    if (!isNaN(dt)) return dt.getTime();
  }
  // DD Mon (no year) — use year from fallback timestamp
  m = raw.match(/^(\d{1,2})\s+([A-Za-z]{3,})$/);
  if (m) {
    const year = new Date(fallback).getFullYear();
    const dt = new Date(`${m[1]} ${m[2]} ${year}`);
    if (!isNaN(dt)) return dt.getTime();
  }
  return fallback;
}

function _sortedHistory(items) {
  return [...items].sort((a, b) => {
    let cmp = 0;
    if (_histSortBy === 'date') {
      cmp = _parseSortDate(a) - _parseSortDate(b);
    } else if (_histSortBy === 'category') {
      const ca = (a.result || {}).category || '';
      const cb = (b.result || {}).category || '';
      cmp = ca.localeCompare(cb);
    }
    return _histSortDir === 'asc' ? cmp : -cmp;
  });
}

function _getItemAmount(item) {
  const r = item.result || {};
  const raw = r.total_amount ?? r.amount ?? null;
  if (raw === null) return null;
  const n = parseFloat(String(raw).replace(/[^\d.]/g, ''));
  return isNaN(n) ? null : n;
}

function _activeFilterCount() {
  const f = _histFilter;
  return [f.dateFrom, f.dateTo, f.category, f.amountVal].filter(Boolean).length;
}

function _applyFilters(items) {
  const f = _histFilter;
  return items.filter(item => {
    // Category
    if (f.category) {
      const cat = (item.result || {}).category || '';
      if (cat.toLowerCase() !== f.category) return false;
    }
    // Date range
    const ts = _parseSortDate(item);
    if (f.dateFrom) {
      const from = new Date(f.dateFrom).getTime();
      if (!isNaN(from) && ts < from) return false;
    }
    if (f.dateTo) {
      // include the whole "to" day
      const to = new Date(f.dateTo).getTime() + 86400000 - 1;
      if (!isNaN(to) && ts > to) return false;
    }
    // Amount
    if (f.amountVal !== '' && f.amountOp) {
      const threshold = parseFloat(f.amountVal);
      const amt = _getItemAmount(item);
      if (!isNaN(threshold) && amt !== null) {
        if (f.amountOp === 'gte' && amt < threshold) return false;
        if (f.amountOp === 'lte' && amt > threshold) return false;
      }
    }
    return true;
  });
}

function _filteredAndSorted() {
  return _sortedHistory(_applyFilters(_histItems));
}

function toggleFilterPanel() {
  _histFilterOpen = !_histFilterOpen;
  renderHistoryTab(_histItems);
}

function setHistFilterCat(cat) {
  _histFilter.category = _histFilter.category === cat ? '' : cat;
  renderHistoryTab(_histItems);
}

function onFilterChange() {
  _histFilter.dateFrom  = document.getElementById('hf-date-from')?.value  || '';
  _histFilter.dateTo    = document.getElementById('hf-date-to')?.value    || '';
  _histFilter.amountOp  = document.getElementById('hf-amount-op')?.value  || '';
  _histFilter.amountVal = document.getElementById('hf-amount-val')?.value || '';
  // Only re-render the rows — do NOT touch the filter panel (would kill focus)
  _updateHistoryRows();
}

function clearFilters() {
  _histFilter = { dateFrom: '', dateTo: '', category: '', amountOp: '', amountVal: '' };
  renderHistoryTab(_histItems);  // full re-render is fine for a button click
}

function setHistSort(by) {
  if (_histSortBy === by) {
    _histSortDir = _histSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    _histSortBy  = by;
    _histSortDir = 'desc';
  }
  renderHistoryTab(_histItems);
}

function _updateHistoryRows() {
  const wrap   = document.getElementById('hist-rows-wrap');
  if (!wrap) return;
  const fCount   = _activeFilterCount();
  const filtered = _filteredAndSorted();

  // Update the "X of Y shown" span without touching the filter panel
  const countEl = document.getElementById('hist-filter-count');
  if (countEl) countEl.textContent = fCount ? `${filtered.length} of ${_histItems.length} shown` : '';

  // Update clear-filters button visibility
  const clearBtn = document.getElementById('hist-clear-filter-btn');
  if (clearBtn) clearBtn.style.display = fCount ? '' : 'none';

  if (!filtered.length) {
    wrap.innerHTML = '<p class="hist-empty">No entries match the current filters.</p>';
    return;
  }
  wrap.innerHTML = `
    <div class="col-header">
      <div><i class="fa-regular fa-image me-1"></i> Image</div>
      <div><i class="fa-solid fa-table-list me-1"></i> Extracted Fields</div>
      <div><i class="fa-solid fa-align-left me-1"></i> Plain Text</div>
      <div><i class="fa-solid fa-trash me-1"></i> Actions</div>
    </div>
    <div class="result-rows" id="historyRows">
      ${filtered.map(item => buildRow(`h${++rowIdx}`, { ...item, source: 'history' }, { historyMode: true })).join('')}
    </div>`;
  _buildHistorySummary(filtered);
}

function renderHistoryTab(items) {
  const body   = document.getElementById('historyBody');
  const f      = _histFilter;
  const fCount = _activeFilterCount();

  const dirIcon = _histSortDir === 'asc'
    ? '<i class="fa-solid fa-arrow-up sort-arrow"></i>'
    : '<i class="fa-solid fa-arrow-down sort-arrow"></i>';

  const sortBar = `
    <div class="sort-bar">
      <span class="sort-label"><i class="fa-solid fa-arrow-up-wide-short me-1"></i>Sort:</span>
      <button class="btn-sort ${_histSortBy === 'date'     ? 'active' : ''}" onclick="setHistSort('date')">
        <i class="fa-regular fa-calendar"></i> Date ${_histSortBy === 'date' ? dirIcon : ''}
      </button>
      <button class="btn-sort ${_histSortBy === 'category' ? 'active' : ''}" onclick="setHistSort('category')">
        <i class="fa-solid fa-tag"></i> Category ${_histSortBy === 'category' ? dirIcon : ''}
      </button>
      <button class="filter-toggle ${_histFilterOpen || fCount ? 'active' : ''}" onclick="toggleFilterPanel()">
        <i class="fa-solid fa-filter"></i> Filter
        ${fCount ? `<span class="filter-badge">${fCount}</span>` : ''}
      </button>
      <span id="hist-filter-count" class="filter-result-count"></span>
    </div>`;

  const cats = ['food','travel','hotel'];
  const filterPanel = `
    <div class="filter-panel ${_histFilterOpen ? 'open' : ''}">
      <div class="filter-group">
        <label><i class="fa-regular fa-calendar me-1"></i>Date From</label>
        <input type="date" class="filter-input" id="hf-date-from"
               value="${f.dateFrom}" onchange="onFilterChange()" />
      </div>
      <div class="filter-group">
        <label><i class="fa-regular fa-calendar me-1"></i>Date To</label>
        <input type="date" class="filter-input" id="hf-date-to"
               value="${f.dateTo}" onchange="onFilterChange()" />
      </div>
      <div class="filter-group">
        <label><i class="fa-solid fa-tag me-1"></i>Category</label>
        <div class="filter-cat-row">
          ${cats.map(c => `
            <button class="btn-filter-cat ${f.category === c ? 'on' : ''}"
                    onclick="setHistFilterCat('${c}')">
              ${CAT_ICONS[c] || ''} ${c.charAt(0).toUpperCase()+c.slice(1)}
            </button>`).join('')}
        </div>
      </div>
      <div class="filter-group">
        <label><i class="fa-solid fa-indian-rupee-sign me-1"></i>Amount</label>
        <div class="filter-amount-row">
          <select class="filter-select" id="hf-amount-op" onchange="onFilterChange()">
            <option value="" ${!f.amountOp ? 'selected':''}>—</option>
            <option value="gte" ${f.amountOp==='gte' ? 'selected':''}>≥</option>
            <option value="lte" ${f.amountOp==='lte' ? 'selected':''}>≤</option>
          </select>
          <input type="number" class="filter-input" id="hf-amount-val"
                 placeholder="e.g. 500" value="${f.amountVal}"
                 oninput="onFilterChange()" style="width:90px" />
        </div>
      </div>
      <div class="filter-group" style="justify-content:flex-end">
        <button class="btn-clear-filter" id="hist-clear-filter-btn"
                style="display:${fCount ? '' : 'none'}" onclick="clearFilters()">
          <i class="fa-solid fa-xmark"></i> Clear filters
        </button>
      </div>
    </div>`;

  const toolbar = `
    <div class="hist-toolbar">
      <span class="hist-total">${items.length} unique image${items.length !== 1 ? 's' : ''}</span>
      <button class="btn-clear-hist" onclick="clearHistory()" ${!items.length ? 'disabled' : ''}>
        <i class="fa-solid fa-trash-can"></i> Clear History
      </button>
    </div>`;

  body.innerHTML = toolbar + sortBar + filterPanel + '<div id="hist-rows-wrap"></div><div id="hist-summary-wrap"></div>';

  if (!items.length) {
    document.getElementById('hist-rows-wrap').innerHTML =
      '<p class="hist-empty">No history yet. Use <strong>Reset</strong> to save the current session.</p>';
    return;
  }

  _updateHistoryRows();
}

async function deleteSessionItem(hash, btn) {
  btn.disabled = true;
  try {
    await fetch(`/api/cache/${hash}`, { method: 'DELETE' });
    btn.closest('.result-row').remove();
    // Remove from summary table
    document.querySelector(`#summaryBody tr[data-hash="${hash}"]`)?.remove();
    if (!document.querySelector('#summaryBody tr')) {
      document.getElementById('summaryWrap').style.display = 'none';
    }
    updateExportBtn();
    updateTabCount();
    const body = document.getElementById('resultsBody');
    if (!body.children.length) {
      document.getElementById('resultsWrap').style.display = 'none';
      document.getElementById('emptyState').style.display  = '';
    }
    showToast('Entry removed from session', 'info');
  } catch {
    btn.disabled = false;
    showToast('Failed to delete entry', 'error');
  }
}

async function deleteHistoryItem(hash, btn) {
  if (!confirm('Remove this entry from history?')) return;
  btn.disabled = true;
  try {
    await fetch(`/api/history/${hash}`, { method: 'DELETE' });
    // Remove the row from the DOM
    btn.closest('.result-row').remove();
    // Update count
    const remaining = document.querySelectorAll('#historyRows .result-row').length;
    document.getElementById('tab-history-count').textContent = remaining;
    document.querySelector('.hist-total').textContent =
      `${remaining} unique image${remaining !== 1 ? 's' : ''}`;
    showToast('Entry removed from history', 'info');
  } catch {
    btn.disabled = false;
    showToast('Failed to delete entry', 'error');
  }
}

async function clearHistory() {
  if (!confirm('Clear all history? This cannot be undone.')) return;
  await fetch('/api/history', { method: 'DELETE' });
  renderHistoryTab([]);
  document.getElementById('tab-history-count').textContent = 0;
  showToast('History cleared', 'info');
}

// ─────────────────────────────────────────────────────────────
// Reset
// ─────────────────────────────────────────────────────────────
async function resetSession() {
  const n = document.getElementById('resultsBody').children.length;
  const confirmMsg = n > 0
    ? `Save ${n} item${n !== 1 ? 's' : ''} to history and clear the session?`
    : 'Clear the current session?';
  if (!confirm(confirmMsg)) return;

  const res  = await fetch('/api/reset', { method: 'POST' });
  const data = await res.json();

  document.getElementById('resultsBody').innerHTML = '';
  document.getElementById('summaryBody').innerHTML  = '';
  document.getElementById('resultsWrap').style.display = 'none';
  document.getElementById('summaryWrap').style.display = 'none';
  document.getElementById('emptyState').style.display  = '';
  updateTabCount();
  const added = data.added ?? 0;
  const toastMsg = added > 0
    ? `${added} new item${added !== 1 ? 's' : ''} saved to history`
    : n > 0 ? 'All items already in history — session cleared' : 'Session cleared';
  showToast(toastMsg, 'success');
}

// ─────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────
function fmtDate(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts);
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
      + ' ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  } catch { return ts.replace('T',' ').slice(0,16); }
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ─────────────────────────────────────────────────────────────
// Summary table
// ─────────────────────────────────────────────────────────────
function parsePlainText(text) {
  const result = {};
  for (const line of text.split('\n')) {
    const idx = line.indexOf(':');
    if (idx > 0) {
      const key = line.slice(0, idx).trim().toLowerCase().replace(/\s+/g, '_');
      result[key] = line.slice(idx + 1).trim();
    }
  }
  return result;
}

function _summaryFields(data) {
  const result     = data.result || {};
  const correction = data.correction || '';
  const effective  = correction ? { ...result, ...parsePlainText(correction) } : result;
  const cat  = (effective.category   || '').toLowerCase();
  const meal = (effective.meal_type  || '').toLowerCase().replace(/\s/g, '');
  const catCol = (meal && meal !== 'unknown') ? `${cat}_${meal}` : cat;
  const rawAmt = effective.total_amount ?? effective.amount ?? '';
  // For hotel bills, use check-in date when date is absent
  const date = effective.date || (cat === 'hotel' ? (effective.check_in || '') : '');
  return {
    filename: data.filename_generated || data.filename || '',
    date,
    catCol,
    amount:   rawAmt !== '' ? String(rawAmt) : '',
  };
}

function addSummaryRow(id, data) {
  const tbody = document.getElementById('summaryBody');
  if (!tbody) return;
  const f = _summaryFields(data);
  tbody.insertAdjacentHTML('beforeend', `
    <tr id="sum-${id}" data-hash="${esc(data.hash || '')}">
      <td style="text-align:center;"><input type="checkbox" class="row-check" onchange="updateExportBtn()"></td>
      <td class="sum-filename">${esc(f.filename)}</td>
      <td class="sum-date">${esc(f.date)}</td>
      <td class="sum-cat">${esc(f.catCol)}</td>
      <td class="sum-amount" style="text-align:right;">${esc(f.amount)}</td>
    </tr>`);
  document.getElementById('summaryWrap').style.display = '';
  updateExportBtn();
}

function updateSummaryRow(id, correctionText) {
  const row = document.getElementById(`sum-${id}`);
  if (!row) return;
  const parsed   = parsePlainText(correctionText);
  const dateEl   = row.querySelector('.sum-date');
  const catEl    = row.querySelector('.sum-cat');
  const amtEl    = row.querySelector('.sum-amount');
  if (dateEl && parsed.date)     dateEl.textContent = parsed.date;
  if (catEl) {
    const cat  = (parsed.category  || catEl.textContent.split('_')[0] || '').toLowerCase();
    const meal = (parsed.meal_type || '').toLowerCase().replace(/\s/g, '');
    catEl.textContent = (meal && meal !== 'unknown') ? `${cat}_${meal}` : cat;
  }
  if (amtEl) {
    const rawAmt = parsed.total_amount ?? parsed.amount;
    if (rawAmt !== undefined) amtEl.textContent = String(rawAmt);
  }
}

function toggleSelectAll(cb) {
  document.querySelectorAll('#summaryBody .row-check').forEach(c => c.checked = cb.checked);
  updateExportBtn();
}

function updateExportBtn() {
  const count   = document.querySelectorAll('#summaryBody .row-check:checked').length;
  const btn     = document.getElementById('btnExport');
  const countEl = document.getElementById('summarySelCount');
  if (btn)     btn.disabled     = count === 0;
  if (countEl) countEl.textContent = count ? `${count} selected` : '';
  const allCbs = document.querySelectorAll('#summaryBody .row-check');
  const selAll = document.getElementById('selectAll');
  if (selAll && allCbs.length) {
    selAll.indeterminate = count > 0 && count < allCbs.length;
    selAll.checked       = count > 0 && count === allCbs.length;
  }
}

async function exportSelected() {
  const hashes = [...document.querySelectorAll('#summaryBody .row-check:checked')]
    .map(cb => cb.closest('tr')?.dataset.hash).filter(Boolean);
  if (!hashes.length) { showToast('No items selected', 'error'); return; }

  const btn = document.getElementById('btnExport');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Exporting…';
  try {
    const res = await fetch('/api/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hashes })
    });
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'bills_export.zip'; a.click();
    URL.revokeObjectURL(url);
    showToast(`Exported ${hashes.length} item${hashes.length !== 1 ? 's' : ''}`, 'success');
  } catch (err) {
    showToast('Export failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-file-zipper"></i> Export Selected';
    updateExportBtn();
  }
}

// ─────────────────────────────────────────────────────────────
// History summary
// ─────────────────────────────────────────────────────────────
function _buildHistorySummary(items) {
  const wrap = document.getElementById('hist-summary-wrap');
  if (!wrap) return;
  if (!items.length) { wrap.innerHTML = ''; return; }

  const rows = items.map(item => {
    const f = _summaryFields(item);
    return `<tr data-hash="${esc(item.hash||'')}">
      <td style="text-align:center;"><input type="checkbox" class="hist-row-check" onchange="updateHistExportBtn()"></td>
      <td class="sum-filename">${esc(f.filename)}</td>
      <td>${esc(f.date)}</td>
      <td>${esc(f.catCol)}</td>
      <td class="sum-amount">${esc(f.amount)}</td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <div class="summary-wrap" style="margin-top:1.25rem;">
      <div class="summary-header">
        <div class="summary-title"><i class="fa-solid fa-table-list"></i> Summary</div>
        <div class="summary-actions">
          <span class="summary-sel-count" id="hist-sel-count"></span>
          <button class="btn-export" id="hist-btn-export" onclick="exportHistSelected()" disabled>
            <i class="fa-solid fa-file-zipper"></i> Export Selected
          </button>
        </div>
      </div>
      <table class="summary-table">
        <thead>
          <tr>
            <th style="width:36px;text-align:center;">
              <input type="checkbox" id="hist-select-all" onchange="toggleHistSelectAll(this)">
            </th>
            <th>Filename</th>
            <th>Date</th>
            <th>Category</th>
            <th style="text-align:right;">Amount</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function updateHistExportBtn() {
  const count   = document.querySelectorAll('.hist-row-check:checked').length;
  const btn     = document.getElementById('hist-btn-export');
  const countEl = document.getElementById('hist-sel-count');
  if (btn)     btn.disabled        = count === 0;
  if (countEl) countEl.textContent = count ? `${count} selected` : '';
  const allCbs = document.querySelectorAll('.hist-row-check');
  const selAll = document.getElementById('hist-select-all');
  if (selAll && allCbs.length) {
    selAll.indeterminate = count > 0 && count < allCbs.length;
    selAll.checked       = count > 0 && count === allCbs.length;
  }
}

function toggleHistSelectAll(cb) {
  document.querySelectorAll('.hist-row-check').forEach(c => c.checked = cb.checked);
  updateHistExportBtn();
}

async function exportHistSelected() {
  const hashes = [...document.querySelectorAll('.hist-row-check:checked')]
    .map(cb => cb.closest('tr')?.dataset.hash).filter(Boolean);
  if (!hashes.length) { showToast('No items selected', 'error'); return; }

  const btn = document.getElementById('hist-btn-export');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Exporting…';
  try {
    const res = await fetch('/api/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hashes })
    });
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'bills_export.zip'; a.click();
    URL.revokeObjectURL(url);
    showToast(`Exported ${hashes.length} item${hashes.length !== 1 ? 's' : ''}`, 'success');
  } catch (err) {
    showToast('Export failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-file-zipper"></i> Export Selected';
    updateHistExportBtn();
  }
}

// ─────────────────────────────────────────────────────────────
// Toast
// ─────────────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.className = `t-${type} show`;
  t.textContent = msg;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
